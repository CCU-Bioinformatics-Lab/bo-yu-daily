<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" role="img" data-component-id="candidate-tree-state-b"><title>Candidate B combines a chain-like clone topology with a different clone-specific local-fraction allocation that sums to one.</title><rect width="100%" height="100%" fill="#ffffff"/><path id="edges" data-meaning="candidate B parent-descendant chain topology" d="M120 48V68M120 108V128M120 168V188" fill="none" stroke="#17233a" stroke-width="3"/><image id="node-c1" data-meaning="candidate B founder clone C1" href="data:image/png;base64," x="102" y="8" width="36" height="40" preserveAspectRatio="xMidYMid meet"/><image id="node-c2" data-meaning="candidate B descendant clone C2" href="data:image/png;base64," x="102" y="68" width="36" height="40" preserveAspectRatio="xMidYMid meet"/><image id="node-c3" data-meaning="candidate B descendant clone C3" href="data:image/png;base64," x="102" y="128" width="36" height="40" preserveAspectRatio="xMidYMid meet"/><image id="node-c4" data-meaning="candidate B descendant clone C4" href="data:image/png;base64," x="102" y="188" width="36" height="40" preserveAspectRatio="xMidYMid meet"/><text id="c1-label" data-meaning="candidate B founder identity" x="147" y="20" font-size="9" font-weight="700" text-anchor="start" fill="#17233a">C1</text><text id="eta-c1-label" data-meaning="candidate B local fraction for C1" x="147" y="40" font-size="9" font-weight="400" text-anchor="start" fill="#6d28d9">η=0.40</text><text id="c2-label" data-meaning="candidate B clone identity C2" x="147" y="80" font-size="9" font-weight="700" text-anchor="start" fill="#17233a">C2</text><text id="eta-c2-label" data-meaning="candidate B local fraction for C2" x="147" y="100" font-size="9" font-weight="400" text-anchor="start" fill="#6d28d9">η=0.30</text><text id="c3-label" data-meaning="candidate B clone identity C3" x="147" y="140" font-size="9" font-weight="700" text-anchor="start" fill="#17233a">C3</text><text id="eta-c3-label" data-meaning="candidate B local fraction for C3" x="147" y="160" font-size="9" font-weight="400" text-anchor="start" fill="#6d28d9">η=0.20</text><text id="c4-label" data-meaning="candidate B clone identity C4" x="147" y="200" font-size="9" font-weight="700" text-anchor="start" fill="#17233a">C4</text><text id="eta-c4-label" data-meaning="candidate B local fraction for C4" x="147" y="220" font-size="9" font-weight="400" text-anchor="start" fill="#6d28d9">η=0.10</text><text id="eta-total-label" data-meaning="candidate B local fractions sum" x="120" y="248" font-size="10" font-weight="700" text-anchor="middle" fill="#6d28d9">Ση = 1.00</text></svg>
