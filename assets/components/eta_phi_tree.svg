<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" data-component-id="eta-phi-tree"><title>Eta is clone-local fraction and phi is the clone plus descendants cumulative CCF.</title><rect width="100%" height="100%" fill="#ffffff"/><path id="edges" data-meaning="descendant relation used to derive phi" d="M390 145V195M390 195L245 285M390 195L535 285" fill="none" stroke="#17233a" stroke-width="5"/><image id="node-c1" data-meaning="founder clone C1" href="data:image/png;base64," x="350" y="55" width="80" height="90" preserveAspectRatio="xMidYMid meet"/><image id="node-c2" data-meaning="descendant clone C2" href="data:image/png;base64," x="205" y="245" width="80" height="90" preserveAspectRatio="xMidYMid meet"/><image id="node-c3" data-meaning="descendant clone C3" href="data:image/png;base64," x="495" y="245" width="80" height="90" preserveAspectRatio="xMidYMid meet"/><text id="c1-id" data-meaning="clone identity" x="455" y="85" font-size="22" font-weight="700" text-anchor="start" fill="#17233a">C1</text><text id="eta-c1-label" data-meaning="derived local fraction for C1" x="455" y="125" font-size="19" font-weight="400" text-anchor="start" fill="#17233a">η=0.15</text><text id="phi-c1-label" data-meaning="derived cumulative CCF for C1" x="455" y="160" font-size="19" font-weight="400" text-anchor="start" fill="#17233a">φ=1.00</text><text id="c2-id" data-meaning="clone identity" x="95" y="280" font-size="22" font-weight="700" text-anchor="start" fill="#17233a">C2</text><text id="eta-c2-label" data-meaning="derived local fraction for C2" x="95" y="320" font-size="19" font-weight="400" text-anchor="start" fill="#17233a">η=0.60</text><text id="phi-c2-label" data-meaning="derived cumulative CCF for C2" x="95" y="355" font-size="19" font-weight="400" text-anchor="start" fill="#17233a">φ=0.60</text><text id="c3-id" data-meaning="clone identity" x="600" y="280" font-size="22" font-weight="700" text-anchor="start" fill="#17233a">C3</text><text id="eta-c3-label" data-meaning="derived local fraction for C3" x="600" y="320" font-size="19" font-weight="400" text-anchor="start" fill="#17233a">η=0.25</text><text id="phi-c3-label" data-meaning="derived cumulative CCF for C3" x="600" y="355" font-size="19" font-weight="400" text-anchor="start" fill="#17233a">φ=0.25</text><text id="formula" data-meaning="phi definition" x="900" y="220" font-size="25" font-weight="700" text-anchor="middle" fill="#6d28d9">φv = ηv + descendants</text><text id="eta-total" data-meaning="local fractions sum to one" x="900" y="265" font-size="21" font-weight="400" text-anchor="middle" fill="#17233a">Ση = 1</text></svg>
