<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" data-component-id="cn-segment"><title>One ASCAT segment supplies major and minor copy-number context at the SNV.</title><rect width="100%" height="100%" fill="#ffffff"/><path id="left-boundary" data-meaning="left CN segment boundary" d="M220 90V350" fill="none" stroke="#17233a" stroke-width="4"/><path id="right-boundary" data-meaning="right CN segment boundary" d="M980 90V350" fill="none" stroke="#17233a" stroke-width="4"/><image id="major-1" data-meaning="one major-allele copy" href="data:image/png;base64," x="300" y="100" width="190" height="48" preserveAspectRatio="xMidYMid meet"/><image id="major-2" data-meaning="one major-allele copy" href="data:image/png;base64," x="505" y="100" width="190" height="48" preserveAspectRatio="xMidYMid meet"/><image id="major-3" data-meaning="one major-allele copy" href="data:image/png;base64," x="710" y="100" width="190" height="48" preserveAspectRatio="xMidYMid meet"/><image id="minor-1" data-meaning="one minor-allele copy" href="data:image/png;base64," x="300" y="245" width="190" height="48" preserveAspectRatio="xMidYMid meet"/><path id="snv-guide" data-meaning="SNV position within CN segment" d="M600 155V340" fill="none" stroke="#6d28d9" stroke-width="4"/><image id="marker" data-meaning="SNV marker" href="data:image/png;base64," x="578" y="292" width="44" height="42" preserveAspectRatio="xMidYMid meet"/><text id="cn-label" data-meaning="derived allele-specific and total copy number" x="600" y="55" font-size="22" font-weight="700" text-anchor="middle" fill="#17233a">major=3   minor=1   total CN=4</text></svg>
