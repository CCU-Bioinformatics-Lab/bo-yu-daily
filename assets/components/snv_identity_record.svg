<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" data-component-id="snv-identity-record"><title>One canonical record identifies an SNV by its pipeline mutation_id, reference coordinate, and REF-to-ALT allele substitution.</title><rect width="100%" height="100%" fill="#ffffff"/><rect id="record-card" data-meaning="one canonical SNV identity record" x="60" y="35" width="1080" height="190" rx="18" fill="#fbfcff" stroke="#c8d5e6" stroke-width="3"/><rect id="mutation-cell" data-meaning="mutation identifier field cell" x="80" y="60" width="250" height="140" rx="14" fill="#edf3ff" stroke="#bbcbef" stroke-width="2"/><rect id="chrom-cell" data-meaning="reference chromosome field cell" x="350" y="60" width="180" height="140" rx="14" fill="#f2f6fc" stroke="#c8d5e6" stroke-width="2"/><rect id="pos-cell" data-meaning="reference position field cell" x="550" y="60" width="180" height="140" rx="14" fill="#f2f6fc" stroke="#c8d5e6" stroke-width="2"/><rect id="ref-cell" data-meaning="reference allele field cell" x="750" y="60" width="150" height="140" rx="14" fill="#fff4ed" stroke="#d66b20" stroke-width="2"/><rect id="alt-cell" data-meaning="alternate allele field cell" x="970" y="60" width="150" height="140" rx="14" fill="#effaf0" stroke="#2f8a45" stroke-width="2"/><text id="mutation-label" data-meaning="mutation_id field label" x="205" y="98" font-size="18" font-weight="800" text-anchor="middle" fill="#24499f">mutation_id</text><text id="mutation-value" data-meaning="illustrative pipeline record identifier" x="205" y="152" font-size="30" font-weight="800" text-anchor="middle" fill="#17233a">1</text><text id="chrom-label" data-meaning="chrom field label" x="440" y="98" font-size="18" font-weight="800" text-anchor="middle" fill="#24499f">chrom</text><image id="chrom-ideogram" data-meaning="reference chromosome ideogram with a locus marker" href="data:image/png;base64," x="355" y="118" width="170" height="24" preserveAspectRatio="xMidYMid meet"/><text id="chrom-caption" data-meaning="illustrative reference chromosome identifier" x="440" y="176" font-size="20" font-weight="800" text-anchor="middle" fill="#17233a">chr1</text><text id="pos-label" data-meaning="pos field label" x="640" y="98" font-size="18" font-weight="800" text-anchor="middle" fill="#24499f">pos</text><text id="pos-value" data-meaning="illustrative one-based reference position" x="640" y="152" font-size="20" font-weight="700" text-anchor="middle" fill="#17233a">123,456,789</text><text id="ref-label" data-meaning="ref field label" x="825" y="98" font-size="18" font-weight="800" text-anchor="middle" fill="#9a3d00">ref</text><text id="ref-value" data-meaning="illustrative reference base G" x="825" y="158" font-size="42" font-weight="800" text-anchor="middle" fill="#682600">G</text><text id="alt-label" data-meaning="alt field label" x="1045" y="98" font-size="18" font-weight="800" text-anchor="middle" fill="#12652a">alt</text><text id="alt-value" data-meaning="illustrative alternate base A" x="1045" y="158" font-size="42" font-weight="800" text-anchor="middle" fill="#00441B">A</text><line id="substitution-arrow" data-meaning="illustrative REF-to-ALT substitution relation" x1="910" y1="130" x2="960" y2="130" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/><line id="arrow-head-top" data-meaning="substitution arrow head" x1="960" y1="130" x2="945" y2="117" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/><line id="arrow-head-bottom" data-meaning="substitution arrow head" x1="960" y1="130" x2="945" y2="143" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/></svg>
