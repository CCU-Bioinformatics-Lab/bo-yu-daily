<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" role="img" data-component-id="fixed-k3-clone-tree"><title>A reusable, topology-only schematic of a three-clone tumor tree for the fixed K=3 model setting.</title><rect width="100%" height="100%" fill="#f2f6fc"/><path id="edges" data-meaning="parent-descendant relations in the three-clone topology" d="M160 81L96 125M160 81L224 125" fill="none" stroke="#17233a" stroke-width="3"/><image id="node-c1" data-meaning="founder clone C1" href="data:image/png;base64," x="144" y="45" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c2" data-meaning="descendant clone C2" href="data:image/png;base64," x="80" y="125" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c3" data-meaning="descendant clone C3" href="data:image/png;base64," x="208" y="125" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><text id="c1-label" data-meaning="founder clone identity; also anchors the machine-validated clone count" x="188" y="67" font-size="12" font-weight="700" text-anchor="start" fill="#17233a">C1</text><text id="c2-label" data-meaning="clone identity" x="57" y="148" font-size="12" font-weight="700" text-anchor="end" fill="#17233a">C2</text><text id="c3-label" data-meaning="clone identity" x="250" y="148" font-size="12" font-weight="700" text-anchor="start" fill="#17233a">C3</text></svg>
