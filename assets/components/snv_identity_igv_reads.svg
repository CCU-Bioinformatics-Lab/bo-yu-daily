" stroke="#2f8a45" stroke-width="2"/><text id="base-4-label" data-meaning="ALT A base call at focal SNV" x="560" y="408" font-size="21" font-weight="800" text-anchor="middle" fill="#00441b">A</text><rect id="read-5" data-meaning="one REF-supporting aligned read block" x="190" y="435" width="620" height="30" rx="6" fill="#d9e0e8" stroke="#94a3b8" stroke-width="1"/><rect id="base-5" data-meaning="REF G base call tile at focal SNV" x="544" y="436" width="32" height="28" rx="4" fill="#fff4ed" stroke="#d66b20" stroke-width="2"/><text id="base-5-label" data-meaning="REF G base call at focal SNV" x="560" y="458" font-size="21" font-weight="800" text-anchor="middle" fill="#682600">G</text><text id="reads-label" data-meaning="aligned reads section label" x="70" y="285" font-size="16" font-weight="700" text-anchor="start" fill="#475569">aligned reads</text><rect id="summary-card" data-meaning="illustrative pileup count summary panel" x="900" y="235" width="250" height="215" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text id="summary-title" data-meaning="count summary heading" x="925" y="280" font-size="21" font-weight="800" text-anchor="start" fill="#17233a">illustrative pileup</text><text id="read-summary" data-meaning="derived illustrative REF supporting read count" x="925" y="315" font-size="17" font-weight="700" text-anchor="start" fill="#17233a">REF reads = 3</text><text id="alt-summary" data-meaning="derived illustrative ALT supporting read count" x="925" y="345" font-size="17" font-weight="700" text-anchor="start" fill="#17233a">ALT reads = 2</text><text id="total-summary" data-meaning="derived illustrative total read count" x="925" y="375" font-size="17" font-weight="700" text-anchor="start" fill="#17233a">total reads = 5</text><text id="fraction-summary" data-meaning="derived illustrative ALT fraction" x="925" y="405" font-size="17" font-weight="800" text-anchor="start" fill="#6d28d9">ALT fraction = 40%</text><text id="summary-boundary" data-meaning="mockup boundary note" x="925" y="432" font-size="13" font-weight="400" text-anchor="start" fill="#64748b">Illustrative, not coverage.</text></svg>
