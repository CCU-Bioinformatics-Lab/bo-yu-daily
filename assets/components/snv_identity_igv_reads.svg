<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" data-component-id="snv-identity-igv-reads"><title>An IGV-style read stack locates one illustrative canonical SNV record at a shared genomic coordinate; only the focal base distinguishes REF from ALT support.</title><rect width="100%" height="100%" fill="#ffffff"/><text id="heading" data-meaning="component heading" x="60" y="50" font-size="27" font-weight="800" text-anchor="start" fill="#17233a">一顆 SNV 的 IGV-style reads</text><text id="record-label" data-meaning="illustrative canonical SNV identity" x="60" y="84" font-size="18" font-weight="700" text-anchor="start" fill="#475569">mutation_id = 1   ·   chr1:123,456,789   ·   REF G → ALT A</text><text id="ruler-title" data-meaning="reference coordinate system label" x="85" y="135" font-size="16" font-weight="700" text-anchor="start" fill="#475569">chr1 coordinate</text><line id="ruler" data-meaning="local genomic coordinate ruler" x1="150" y1="165" x2="860" y2="165" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line id="tick-left" data-meaning="left flanking coordinate tick" x1="300" y1="153" x2="300" y2="177" stroke="#334155" stroke-width="3" stroke-linecap="round"/><line id="tick-snv" data-meaning="focal SNV coordinate tick" x1="560" y1="145" x2="560" y2="185" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/><line id="tick-right" data-meaning="right flanking coordinate tick" x1="820" y1="153" x2="820" y2="177" stroke="#334155" stroke-width="3" stroke-linecap="round"/><text id="coord-left" data-meaning="left coordinate label" x="300" y="205" font-size="16" font-weight="400" text-anchor="middle" fill="#17233a">123,456,787</text><text id="coord-snv" data-meaning="focal one-based SNV position label" x="560" y="205" font-size="16" font-weight="800" text-anchor="middle" fill="#6d28d9">123,456,789</text><text id="coord-right" data-meaning="right coordinate label" x="820" y="205" font-size="16" font-weigh