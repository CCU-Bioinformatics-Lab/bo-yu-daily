<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" data-component-id="cn-segment-context"><title>The SNV lies inside one ASCAT segment that supplies major_cn and minor_cn, with total_cn equal to their sum.</title><rect width="100%" height="100%" fill="#ffffff"/><text id="segment-label" data-meaning="ASCAT segment label" x="600" y="48" font-size="28" font-weight="700" text-anchor="middle" fill="#17233a">ASCAT segment</text><line id="locus-line" data-meaning="local genomic coordinate through the copy-number segment" x1="140" y1="110" x2="1060" y2="110" stroke="#17233a" stroke-width="4" stroke-linecap="round"/><line id="left-boundary" data-meaning="left boundary of the ASCAT segment" x1="220" y1="75" x2="220" y2="145" stroke="#17233a" stroke-width="4" stroke-linecap="round"/><line id="right-boundary" data-meaning="right boundary of the ASCAT segment" x1="980" y1="75" x2="980" y2="145" stroke="#17233a" stroke-width="4" stroke-linecap="round"/><line id="snv-guide" data-meaning="SNV position aligned to the containing ASCAT segment" x1="600" y1="110" x2="600" y2="180" stroke="#6d28d9" stroke-width="4" stroke-linecap="round"/><image id="snv-marker" data-meaning="one SNV locus marker" href="data:image/png;base64," x="578" y="84" width="44" height="42" preserveAspectRatio="xMidYMid meet"/><text id="snv-label" data-meaning="SNV locus label" x="650" y="210" font-size="24" font-weight="700" text-anchor="start" fill="#6d28d9">SNV locus</text><image id="major-1" data-meaning="one of three major-allele copies at the SNV-containing segment" href="data:image/png;base64," x="300" y="245" width="560" height="34" preserveAspectRatio="xMidYMid meet"/><text id="major-label" data-meaning="derived major-allele copy number" x="90" y="292" font-size="28" font-weight="700" text-anchor="start" fill="#17233a">major_cn = 3</text><image id="major-2" data-meaning="one of three major-allele copies at the SNV-containing segment" href="data:image/png;base64," x="300" y="285" width="560" height="34" preserveAspectRatio="xMidYMid meet"/><image id="major-3" data-meaning="one of three major-allele copies at the SNV-containing segment" href="data:image/png;base64," x="300" y="325" width="560" height="34" preserveAspectRatio="xMidYMid meet"/><image id="minor-1" data-meaning="one minor-allele copy at the SNV-containing segment" href="data:image/png;base64," x="300" y="365" width="560" height="34" preserveAspectRatio="xMidYMid meet"/><line id="copy-locus-guide" data-meaning="SNV locus guide crossing every displayed allele-specific copy" x1="600" y1="235" x2="600" y2="405" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"/><rect id="total-box" data-meaning="result field containing total copy number" x="900" y="260" width="240" height="110" rx="16" fill="#f2efff" stroke="#6d28d9" stroke-width="3"/><text id="total-label" data-meaning="derived total copy number" x="1020" y="307" font-size="28" font-weight="700" text-anchor="middle" fill="#5b21b6">total_cn = 4</text><text id="total-formula" data-meaning="formula relating total copy number to major and minor copy number" x="1020" y="345" font-size="18" font-weight="700" text-anchor="middle" fill="#5b21b6">major_cn + minor_cn</text><text id="minor-label" data-meaning="derived minor-allele copy number" x="90" y="387" font-size="28" font-weight="700" text-anchor="start" fill="#17233a">minor_cn = 1</text></svg>
