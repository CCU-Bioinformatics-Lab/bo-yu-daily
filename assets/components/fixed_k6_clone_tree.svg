<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" data-component-id="fixed-k6-clone-tree"><title>A reusable, topology-only schematic of a six-clone tumor tree for the fixed K=6 model setting.</title><rect width="100%" height="100%" fill="#f2f6fc"/><text id="title" data-meaning="standalone component title" x="160" y="25" font-size="18" font-weight="700" text-anchor="middle" fill="#17233a">fixed K=6 clone tree</text><path id="edges" data-meaning="parent-descendant relations in the six-clone topology" d="M160 81L96 105M160 81V105M160 81L224 105M96 141L128 180M224 141L192 180" fill="none" stroke="#17233a" stroke-width="3"/><image id="node-c1" data-meaning="founder clone C1" href="data:image/png;base64," x="144" y="45" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c2" data-meaning="descendant clone C2" href="data:image/png;base64," x="80" y="105" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c3" data-meaning="descendant clone C3" href="data:image/png;base64," x="144" y="105" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c4" data-meaning="descendant clone C4" href="data:image/png;base64," x="208" y="105" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c5" data-meaning="second-level descendant clone C5" href="data:image/png;base64," x="112" y="180" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><image id="node-c6" data-meaning="second-level descendant clone C6" href="data:image/png;base64," x="176" y="180" width="32" height="36" preserveAspectRatio="xMidYMid meet"/><text id="c1-label" data-meaning="founder clone identity" x="188" y="67" font-size="12" font-weight="700" text-anchor="start" fill="#17233a">C1</text><text id="c2-label" data-meaning="clone identity" x="57" y="128" font-size="12" font-weight="700" text-anchor="end" fill="#17233a">C2</text><text id="c3-label" data-meaning="clone identity placed below the central clone mark and clear of the branch line" x="160" y="162" font-size="12" font-weight="700" text-anchor="middle" fill="#17233a">C3</text><text id="c4-label" data-meaning="clone identity" x="250" y="128" font-size="12" font-weight="700" text-anchor="start" fill="#17233a">C4</text><text id="c5-label" data-meaning="clone identity" x="100" y="203" font-size="12" font-weight="700" text-anchor="end" fill="#17233a">C5</text><text id="c6-label" data-meaning="clone identity" x="220" y="203" font-size="12" font-weight="700" text-anchor="start" fill="#17233a">C6</text><text id="k-label" data-meaning="derived number of displayed clone nodes" x="160" y="238" font-size="14" font-weight="700" text-anchor="middle" fill="#17233a">K=6 clone nodes · topology only</text></svg>
