<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" data-component-id="locus-panel"><title>One SNV occupies one aligned genomic coordinate in a local locus.</title><rect width="100%" height="100%" fill="#ffffff"/><path id="track" data-meaning="local genomic coordinate axis" d="M130 210H1070" fill="none" stroke="#17233a" stroke-width="5"/><path id="tick-left" data-meaning="coordinate tick" d="M330 185V235" fill="none" stroke="#17233a" stroke-width="4"/><path id="tick-snv" data-meaning="SNV coordinate tick" d="M600 175V245" fill="none" stroke="#6d28d9" stroke-width="5"/><path id="tick-right" data-meaning="coordinate tick" d="M870 185V235" fill="none" stroke="#17233a" stroke-width="4"/><image id="marker" data-meaning="SNV position marker" href="data:image/png;base64," x="568" y="108" width="64" height="62" preserveAspectRatio="xMidYMid meet"/><text id="chrom" data-meaning="chromosome label" x="130" y="95" font-size="24" font-weight="700" text-anchor="start" fill="#17233a">chr17</text><text id="variant" data-meaning="example SNV identity" x="600" y="75" font-size="22" font-weight="700" text-anchor="middle" fill="#6d28d9">G→A</text><text id="coord-left" data-meaning="example genomic coordinate" x="330" y="300" font-size="18" font-weight="400" text-anchor="middle" fill="#17233a">7,577,480</text><text id="coord-snv" data-meaning="example SNV genomic coordinate" x="600" y="300" font-size="18" font-weight="400" text-anchor="middle" fill="#17233a">7,577,500</text><text id="coord-right" data-meaning="example genomic coordinate" x="870" y="300" font-size="18" font-weight="400" text-anchor="middle" fill="#17233a">7,577,520</text></svg>
