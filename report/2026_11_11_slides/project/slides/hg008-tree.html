<aside>這頁要看的是：HG008 的樹，用單細胞檢查後，可靠的是 4 群。每個大圓是一群細胞，小圓是細胞，裡面的星星是它帶的突變。最左邊 8 顆沒有紅星，對應選殖株 H；紅星那段有 127 個 SNV，只帶紅星的有 63 顆，對應 G、A、B；再往右多了紫星 14 個 SNV，32 顆，對應 E、F；最右邊三種星都有，金星 68 個 SNV，16 顆，對應 C、D。選殖株和單細胞看到同一組突變，所以這 4 群互相確認。底下那幾段分枝，單細胞還沒證實，併在同一群。</aside>
