<aside>這週的 AI 環境改善，是把研究知識庫分成四層。最上面是索引，每篇論文一列，先在這裡找路徑；第二層是摘要，寫結論和數字，標出哪些是論文、哪些是推論；摘要不夠，再到第三層全文，用關鍵字找原句；最底下是第一手資料，就是 PDF、DOI 和程式。AI 回答時先從上往下找，不夠才往下讀。最後一頁是模擬器的兩個方案。</aside>
