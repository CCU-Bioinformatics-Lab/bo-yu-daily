<aside>這頁畫知識庫怎麼用。上面是放一篇論文：拿到論文，開一個資料夾，放全文、摘要、來源三個檔，最後在索引加一列，寫路徑、一句話和關鍵字。下面是 agent 怎麼找：先查索引，再讀摘要，打勾表示夠了就回答；不夠才讀全文，最後才看 PDF 或補充表。最底層找到的新資料會補回摘要，像今天 Lefèbvre 的癌別和 purity。回答時標來源和讀到第幾層。下一頁回到模擬器的三個方案。</aside>
