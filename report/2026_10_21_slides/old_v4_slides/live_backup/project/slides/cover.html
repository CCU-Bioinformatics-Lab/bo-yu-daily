<h1 style="font-family:'Noto Serif TC', Georgia, serif;font-size:96px;font-weight:700;line-height:1.25;color:#F7F6F2">只用 bulk 分不出的樹關係，<br>long read 能幫忙嗎？</h1>
<p style="font-size:40px;color:#BFD0E0">2026-10-21 腫瘤演化樹研究進度</p>
<aside>大家好，今天報告腫瘤演化樹的研究進度。腫瘤演化樹，就是把腫瘤裡的細胞依照誰從誰長出來，排成一棵樹。標題裡的 bulk，是把很多細胞混在一起定序；long read 是一次能讀很長一段 DNA 的定序方式。我們發現，只靠 bulk 資料，有些樹的關係分不出來。今天想談的就是：long read 多給的資訊，能不能幫我們把這些關係分清楚。上面這四個顏色，後面講 long read 的頁面會用到，到時候再解釋。</aside>
