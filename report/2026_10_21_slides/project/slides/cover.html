<p style="font-size:40px;color:#BFD0E0">2026-10-21 實驗室會議</p>
<aside>大家好，今天報告腫瘤演化樹的文獻調查。腫瘤演化樹，就是把腫瘤裡的細胞依照誰從誰長出來，排成一棵樹。我們想知道，長讀帶來的資訊能不能讓這棵樹排得更準。長讀，英文叫 long read，就是一次能讀很長一段 DNA 的定序方式。要回答這件事，我們需要一份資料：裡面有已知正確答案的樹，也就是真值樹，而且同一批樣本還有長讀。這樣才能拿建出來的樹去和答案比。所以今天的題目很直接：這種資料存在嗎？如果不存在，前人是怎麼自己做驗證資料的？下一頁先把這個問題拆開來看。</aside>
